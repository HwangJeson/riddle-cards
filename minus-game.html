:root { --ink: #3b2d22; --soft: #7a6553; --paper: #fffdf8; --rose: #ff6b9a; --sky: #4dabf7; --butter: #ffd43b; --mint: #69db7c; --grape: #9775fa; --orange: #ff922b; --shadow: rgba(60, 40, 30, .22);
  --fr: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; --fb: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #ffe9a8; color: var(--ink); font-family: var(--fb); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.screen { position: fixed; inset: 0; display: none; }
.screen.on { display: flex; }
svg { display: block; }
/* ---------- home / settings */
#home { flex-direction: column; align-items: center; background: linear-gradient(180deg, #ffe9a8 0%, #ffd6e8 55%, #d8f3ff 100%); overflow-y: auto; touch-action: pan-y; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

<body>
<section id="home" class="screen on">

(() => {
'use strict';
const $ = s => document.querySelector(s);

const audio = (() => {

function makeSet(lv) {
  const pairs = [];

  const big = [], small = [];
  for (let a = 2; a <= 10; a++) for (let b = 1; b < a; b++) (a >= 6 ? big : small).push({ a, b, c: a - b });
  const set = shuffle(big).slice(0, 8).concat(shuffle(small).slice(0, 2));
  return shuffle(set);
}

  const cand = shuffle([P.c - 1, P.c + 1, P.c - 2, P.c + 2, P.b, P.a, P.c + 3, P.c - 3].filter(v => v >= 0 && v <= max && v !== P.c));
  for (const v of cand) { if (s.size >= 4) break; s.add(v); }

}

  const y = document.createElement('div'); y.className = 'yum'; y.textContent = pick(['냠!', '냠냠!', '아삭!', '쩝쩝!', '맛있다!']); y.style.left = m.x + 'px'; y.style.top = (m.y - 26) + 'px'; flyEl.appendChild(y); timer(() => y.remove(), 750);
  const slot = slotsEl.children[G.fed - 1]; if (slot) slot.classList.add('on');
  voice.speak(NATIVE[G.fed]);
  if (G.fed >= P.b && G.inflight === 0) full();
}
function refuse(el) {
  if (!G) return;
  animalEl.classList.remove('shake'); void animalEl.offsetWidth; animalEl.classList.add('shake'); timer(() => animalEl.classList.remove('shake'), 500);
  audio.fx.nope();
  if (el) { el.classList.add('wig'); timer(() => el.classList.remove('wig'), 600); }
  const T = G.theme, P = cur();
  if (G.phase === 'full' || G.phase === 'answer') { say('이제 배불러요! 🤤 더는 못 먹어요'); voice.speak('이제 배불러요!'); timer(() => { if (G && G.phase === 'answer') askPrompt(); }, 1500); }
  else if (G.phase === 'done') { say(`벌써 다 맞혔어요! 🎉`); }
}
function full() {
  G.phase = 'full'; eqB.classList.remove('hl');
  animalEl.classList.add('happy', 'wiggle'); timer(() => animalEl.classList.remove('wiggle'), 1500);
  say('냠냠~ 배불러요! 🤤'); audio.fx.full(); voice.speak('냠냠, 배불러요!');
  timer(askAnswer, 1400);
}
function askPrompt() {
  const T = G.theme;
  say(`${T.food}${josa(T.food, '이', '가')} 몇 ${T.unit} 남았을까요?`);
}
function askAnswer() {
  if (!G) return;
  const P = cur(), T = G.theme;
  G.phase = 'answer'; animalEl.classList.remove('happy'); slotsEl.hidden = true;
  askPrompt(); voice.speak(`${T.food}${josa(T.food, '이', '가')} 몇 ${T.unit} 남았을까요?`);
  tableEl.querySelectorAll('.food:not(.gone)').forEach((f, i) => { f.classList.add('countable'); timer(() => { f.classList.add('wig'); timer(() => f.classList.remove('wig'), 600); }, i * 70); });
  answersEl.innerHTML = '';
  choicesFor(P, G.lv === 1 ? 5 : 10).forEach(v => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ans'; b.textContent = v;
    b.addEventListener('click', () => answer(b, v)); answersEl.appendChild(b);
  });
}
/* ---------- counting help: tap the remaining foods to number them */
function addBadge(el, n) { let b = el.querySelector('.badge'); if (!b) { b = document.createElement('div'); b.className = 'badge'; el.appendChild(b); } b.textContent = n; }
function countTap(el) {
  if (el.querySelector('.badge')) { audio.fx.tap(); return; }
  G.badges++; addBadge(el, G.badges); audio.fx.pop(); voice.speak(NATIVE[Math.min(G.badges, 10)]);
  el.classList.add('wig'); timer(() => el.classList.remove('wig'), 600);
}
function autoCount(then) {
  const foods = [...tableEl.querySelectorAll('.food:not(.gone)')];
  foods.forEach(f => { const b = f.querySelector('.badge'); if (b) b.remove(); });
  G.badges = 0;
  foods.forEach((f, i) => timer(() => { if (!G) return; G.badges = i + 1; addBadge(f, i + 1); audio.fx.pop(); voice.speak(NATIVE[i + 1]); f.classList.add('wig'); timer(() => f.classList.remove('wig'), 600); }, 350 + i * 520));
  timer(then, 350 + foods.length * 520 + 200);
}
/* ---------- answering */
function answer(btn, v) {
  if (!G || G.phase !== 'answer') return;
  audio.unlock();
  const P = cur(), T = G.theme;
  if (v === P.c) {
    G.phase = 'done'; G.results.push({ a: P.a, b: P.b, c: P.c, first: G.tries === 0, theme: T.id });
    btn.classList.add('yes'); answersEl.querySelectorAll('.ans').forEach(x => { x.style.pointerEvents = 'none'; x.classList.remove('pulse'); });
    eqQ.textContent = P.c; eqQ.classList.add('done');
    animalEl.classList.add('happy', 'jump'); timer(() => animalEl.classList.remove('jump'), 1300);
    audio.fx.correct(); FX.sparkle(window.innerWidth / 2, eqQ.getBoundingClientRect().top + 30, 18); FX.burst(0.35);
    say(`딩동댕! <b>${P.a} − ${P.b} = ${P.c}</b> 🎉`); voice.speak(`딩동댕! ${SINO[P.a]} 빼기 ${SINO[P.b]}${josa(SINO[P.b], '은', '는')} ${SINO[P.c]}!`);
    updateProg();
    const nb = document.createElement('button'); nb.type = 'button'; nb.id = 'next'; nb.textContent = G.idx + 1 >= TOTAL ? '결과 보기 🏆' : '다음 ➜'; nb.addEventListener('click', () => { audio.fx.pick(); nextProblem(); });
    timer(() => { if (G && G.phase === 'done') answersEl.appendChild(nb); }, 500);
    timer(() => { if (G && G.phase === 'done') nextProblem(); }, 3200);
    return;
  }
  G.tries++; btn.classList.add('no'); audio.fx.wrong();
  animalEl.classList.remove('shake'); void animalEl.offsetWidth; animalEl.classList.add('shake'); timer(() => animalEl.classList.remove('shake'), 500);
  if (G.tries === 1) {
    say('음… 다시 세어 볼까요? 🤔'); voice.speak('음, 다시 세어 볼까요?');
    tableEl.querySelectorAll('.food:not(.gone)').forEach((f, i) => timer(() => { f.classList.add('wig'); timer(() => f.classList.remove('wig'), 600); }, 300 + i * 90));
  } else if (G.tries === 2) {
    say('같이 세어 봐요! 👆'); voice.speak('같이 세어 봐요.');
    autoCount(() => { if (!G || G.phase !== 'answer') return; say(`모두 <b>${P.c}${T.unit}</b>${josa(T.unit, '이에요', '예요')}! 숫자를 골라요`); voice.speak(`모두 ${ADN[P.c]} ${T.unit}${josa(T.unit, '이에요', '예요')}. 숫자를 골라요.`); });
  } else {
    say(`답은 <b>${P.c}</b>! 반짝이는 숫자를 눌러요 ✨`); voice.speak(`답은 ${SINO[P.c]}! 반짝이는 숫자를 눌러요.`);
    answersEl.querySelectorAll('.ans').forEach(x => { if (+x.textContent === P.c) x.classList.add('pulse'); });
  }
}
/* ---------- finish */
function finishSet() {
  const score = G.results.filter(r => r.first).length, stars = score === TOTAL ? 3 : score >= 7 ? 2 : 1;
  const best = store.get('best', {}), prev = best[G.lv]; const isBest = !prev || score > prev.score;
  if (isBest) { best[G.lv] = { score, stars, date: Date.now() }; store.set('best', best); }
  G.phase = 'end';
  $('#doneTitle').textContent = score === TOTAL ? '완벽해요! 🏆' : score >= 7 ? '참 잘했어요! 🎉' : '수고했어요! 💪';
  $('#doneStars').textContent = '⭐'.repeat(stars);
  $('#doneAnimals').innerHTML = shuffle(ART.THEMES).slice(0, 5).map(t => `<div class="an">${ART.animals[t.id]()}</div>`).join('');
  $('#doneInfo').innerHTML = `${NAMES[player]} · ${G.lv === 1 ? '1~5 빼기' : '1~10 빼기'}<br>한 번에 맞힌 문제 <b>${score} / ${TOTAL}</b>` + (isBest ? '<br>🏆 새로운 기록이에요!' : (prev ? `<br>최고 기록 ${prev.score} / ${TOTAL}` : ''));
  $('#doneList').innerHTML = G.results.map(r => `<span class="${r.first ? 'g' : ''}">${r.a} − ${r.b} = ${r.c} ${r.first ? '⭐' : '✔'}</span>`).join('');
  audio.fx.fanfare(); timer(() => audio.fx.cheer(), 900); FX.confetti();
  voice.speak(score === TOTAL ? '와, 완벽해요! 모두 맞혔어요!' : score >= 7 ? '참 잘했어요!' : '수고했어요! 다시 한번 해 볼까요?');
  $('#done').classList.add('on');
}
$('#doneAgain').addEventListener('click', () => { audio.fx.pick(); $('#done').classList.remove('on'); startSet(G.lv); });
$('#doneHome').addEventListener('click', () => { audio.fx.tap(); $('#done').classList.remove('on'); goHome(); });
function goHome() { clearTimers(); voice.stop(); G = null; D = null; flyEl.innerHTML = ''; game.classList.remove('on'); home.classList.add('on'); showBest(); }

/* ---------- animal tap: a little tease */
animalEl.addEventListener('pointerdown', () => {
  if (!G) return; audio.unlock(); audio.fx.tap();
  animalEl.classList.remove('wiggle'); void animalEl.offsetWidth; animalEl.classList.add('wiggle'); timer(() => animalEl.classList.remove('wiggle'), 1500);
  const P = cur(), T = G.theme;
  if (G.phase === 'feed') voice.speak(`${T.food} ${ADN[P.b - G.fed - G.inflight] || ''} ${T.unit} 더 주세요!`);
  else if (G.phase === 'answer') voice.speak(`${T.food}${josa(T.food, '이', '가')} 몇 ${T.unit} 남았을까요?`);
});

/* ---------- particles */
const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d'); let P = [], raf = 0, last = 0, DPR = 1;
  function size() { DPR = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR); cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; }
  size(); window.addEventListener('resize', size);
  function star(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); } g.closePath(); g.fill(); }
  function frame(t) {
    raf = 0; const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = P.length - 1; i >= 0; i--) {
      const f = P[i]; f.life += dt; if (f.life > f.max) { P.splice(i, 1); continue; }
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.kind === 'confetti' ? 420 : 300) * dt; f.rot += f.vr * dt;
      const a = 1 - f.life / f.max;
      g.save(); g.globalAlpha = Math.min(1, a * 1.5); g.fillStyle = f.color; g.translate(f.x, f.y); g.rotate(f.rot);
      if (f.kind === 'star') star(0, 0, f.size * (0.6 + a * 0.6)); else g.fillRect(-f.size / 2, -f.size * .3, f.size, f.size * .6);
      g.restore();
    }
    if (P.length) raf = requestAnimationFrame(frame); else { last = 0; g.clearRect(0, 0, innerWidth, innerHeight); }
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa', '#ff9fd1'];
  return {
    sparkle(x, y, n = 14) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = rand(90, 260); P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0, max: rand(.5, .9), color: pick(['#ffd43b', '#ff6b9a', '#4dabf7', '#69db7c', '#fff']), kind: 'star', size: rand(7, 14), rot: 0, vr: rand(-4, 4) }); } kick(); },
    burst(k = 1) { for (let i = 0; i < 60 * k; i++) P.push({ x: rand(0, innerWidth), y: -20, vx: rand(-60, 60), vy: rand(40, 160), life: 0, max: rand(1.6, 2.6), color: pick(COLORS), kind: 'confetti', size: rand(8, 14), rot: rand(0, 6), vr: rand(-6, 6) }); kick(); },
    confetti() { for (let k = 0; k < 4; k++) setTimeout(() => { for (let i = 0; i < 70; i++) P.push({ x: rand(0, innerWidth), y: -20, vx: rand(-60, 60), vy: rand(40, 160), life: 0, max: rand(2.2, 3.6), color: pick(COLORS), kind: 'confetti', size: rand(8, 16), rot: rand(0, 6), vr: rand(-6, 6) }); kick(); }, k * 450); }
  };
})();

/* ---------- misc */
const fsEl = document.documentElement, btnFull = $('#btnFull');
if (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen) {
  btnFull.hidden = false;
  btnFull.addEventListener('click', () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (p && p.catch) p.catch(() => {}); } } catch (e) { /* not allowed */ } });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { audio.pause(); voice.stop(); } else audio.resume(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#done').classList.contains('on')) return; if (G) goHome(); } });
window.__nyam = { get G() { return G; }, startSet, nextProblem, feed, answer, goHome, finishSet, makeSet };

})();
